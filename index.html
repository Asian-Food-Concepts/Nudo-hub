<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nudo Hub</title>
<script>
  // Nudo Hub is now a login-gated app. The public index page just forwards
  // to the app, which handles login. If a Supabase auth token arrived in the
  // URL hash (magic-link login landed here), carry it over so the session
  // is picked up by the app.
  (function () {
    var h = window.location.hash;
    if (h && (h.indexOf('access_token=') !== -1 || h.indexOf('error=') !== -1)) {
      window.location.replace('/Nudo-hub/app.html' + h);
    } else {
      window.location.replace('/Nudo-hub/app.html');
    }
  })();
</script>
</head>
<body>
  <noscript>
    <p style="font-family:system-ui,sans-serif;text-align:center;margin-top:40px;">
      Nudo Hub es una app con acceso del equipo. Activa JavaScript para entrar.
      <br><a href="/Nudo-hub/app.html">Ir a Nudo Hub</a>
    </p>
  </noscript>
</body>
</html>
